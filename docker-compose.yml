services:
  backend:
    build: ./backend
    environment:
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      MAX_SESSION_BYTES: ${MAX_SESSION_BYTES:-150000000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
